<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple CI/CD Calculator</title>
  <style>body{font-family:sans-serif;max-width:360px;margin:60px auto}input,select,button{font-size:16px;margin:4px}</style>
</head>
<body>
  <h1>Calculator</h1>
  <input id="a" type="number" value="6">
  <select id="op">
    <option value="add">+</option>
    <option value="subtract">-</option>
    <option value="multiply">×</option>
    <option value="divide">÷</option>
  </select>
  <input id="b" type="number" value="3">
  <button id="go">=</button>
  <h2 id="out"></h2>
  <script type="module">
    import * as calc from './calculator.js';
    document.getElementById('go').onclick = () => {
      const a = +document.getElementById('a').value;
      const b = +document.getElementById('b').value;
      const op = document.getElementById('op').value;
      const out = document.getElementById('out');
      try { out.textContent = calc[op](a, b); }
      catch (e) { out.textContent = e.message; }
    };
  </script>
</body>
</html>
